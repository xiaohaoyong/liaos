[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = "0.19"
# 新闻 RSS 抓取：阻塞式 HTTP 客户端（rustls + ring，免 NASM/CMake，适配打包环境）
ureq = { version = "2.12", default-features = false, features = ["tls"] }
# RSS/Atom 流式解析（与 tauri → plist 传递依赖同版本，零新增编译）
quick-xml = "0.41"
# RSS pubDate(RFC2822) / Atom(RFC3339) 时间解析（已在编译图中）
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# Hosts 写入提权：ShellExecuteExW(runas) + 等待子进程退出码（与 tauri 传递依赖同版本，零新增编译）
windows = { version = "0.61", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Threading",
] }

